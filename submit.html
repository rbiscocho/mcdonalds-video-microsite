<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Video | McDonald's Moment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'mcd-red': '#DA291C',
            'mcd-yellow': '#FFC72C',
            'mcd-dark': '#27251F',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-mcd-dark min-h-screen">

  <nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="index.html" class="flex items-center gap-2">
          <svg class="w-9 h-9" viewBox="0 0 100 100" fill="none">
            <path d="M20 75 C20 40 35 20 50 20 C65 20 80 40 80 75" stroke="#FFC72C" stroke-width="12" stroke-linecap="round" fill="none"/>
            <path d="M35 75 C35 50 42 35 50 35 C58 35 65 50 65 75" stroke="#FFC72C" stroke-width="10" stroke-linecap="round" fill="none"/>
          </svg>
          <span class="font-bold text-lg">McDonald's</span>
        </a>
        <div class="flex items-center gap-4">
          <a href="dashboard.html" class="text-sm font-medium text-gray-600 hover:text-mcd-red transition">My Submissions</a>
          <div class="w-9 h-9 bg-mcd-yellow rounded-full flex items-center justify-center font-bold text-sm">JD</div>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-4 py-10">
    <div class="grid lg:grid-cols-12 gap-8">
      <div class="lg:col-span-3">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 sticky top-24">
          <h3 class="font-bold text-sm text-gray-500 uppercase tracking-wide mb-5">Progress</h3>
          <div class="space-y-6">
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center text-sm font-bold shrink-0">✓</div>
              <div>
                <p class="font-semibold text-sm">Account</p>
                <p class="text-xs text-gray-500">Completed</p>
              </div>
            </div>
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-full bg-mcd-yellow text-mcd-dark flex items-center justify-center text-sm font-bold shrink-0">2</div>
              <div>
                <p class="font-semibold text-sm">Upload</p>
                <p class="text-xs text-gray-500">In progress</p>
              </div>
            </div>
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center text-sm font-bold shrink-0">3</div>
              <div>
                <p class="font-semibold text-sm">Review</p>
                <p class="text-xs text-gray-500">Pending</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="lg:col-span-9">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-10">
          <h1 class="text-2xl sm:text-3xl font-extrabold">Submit a Video</h1>
          <p class="mt-2 text-gray-600">Share your McDonald's moment with us!</p>

          <form class="mt-8 space-y-6" onsubmit="event.preventDefault(); alert('Video submitted successfully! (This is a prototype)'); window.location.href='dashboard.html';">
            <div>
              <label class="block text-sm font-medium mb-2">Video File *</label>
              <div id="dropzone" class="border-2 border-dashed border-gray-300 rounded-2xl p-10 text-center hover:border-mcd-yellow hover:bg-yellow-50/50 transition cursor-pointer"
                   onclick="document.getElementById('video-input').click()">
                <div class="w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <svg class="w-8 h-8 text-mcd-yellow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                  </svg>
                </div>
                <p class="font-semibold text-lg">Drag & drop your video here</p>
                <p class="text-mcd-red font-medium mt-1">or click to browse</p>
                <p class="text-sm text-gray-500 mt-3">Supports MP4, MOV, WebM • Max 500MB • Max 60 seconds recommended</p>
                <input type="file" id="video-input" accept="video/*" class="hidden" onchange="handleFileSelect(this)">
              </div>
              <div id="file-preview" class="hidden mt-4 p-4 bg-gray-50 rounded-xl flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-mcd-red/10 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-mcd-red" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h6l2 2h6a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
                  </div>
                  <div>
                    <p id="file-name" class="font-medium text-sm"></p>
                    <p id="file-size" class="text-xs text-gray-500"></p>
                  </div>
                </div>
                <button type="button" onclick="clearFile()" class="text-gray-400 hover:text-mcd-red">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1.5">Title *</label>
              <input type="text" required placeholder="Enter a title for your video..." maxlength="100"
                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-mcd-red focus:ring-2 focus:ring-red-100 outline-none transition">
            </div>

            <div>
              <label class="block text-sm font-medium mb-1.5">Short Description *</label>
              <textarea required rows="3" maxlength="140" placeholder="Briefly describe your video (max 140 characters)"
                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-mcd-red focus:ring-2 focus:ring-red-100 outline-none transition resize-none"></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1.5">Category</label>
              <select class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-mcd-red focus:ring-2 focus:ring-red-100 outline-none transition bg-white">
                <option value="">Select a category (optional)</option>
                <option>Family Fun</option>
                <option>Friendship</option>
                <option>Foodie Moment</option>
                <option>Drive-Thru Stories</option>
                <option>Happy Meal Magic</option>
                <option>Other</option>
              </select>
            </div>

            <div class="flex items-start gap-3 p-4 bg-yellow-50 rounded-xl border border-yellow-100">
              <input type="checkbox" required id="terms" class="mt-1 w-4 h-4 rounded border-gray-300 text-mcd-red focus:ring-mcd-red">
              <label for="terms" class="text-sm text-gray-700">
                I confirm this is my original content and I agree to the <a href="#" class="text-mcd-red font-medium hover:underline">Video Submission Terms and Conditions</a>. I understand my video will be reviewed before being published.
              </label>
            </div>

            <button type="submit" class="w-full bg-mcd-yellow text-mcd-dark font-bold py-4 rounded-xl hover:bg-yellow-400 transition shadow-sm text-lg flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
              Submit Video
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    function handleFileSelect(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        document.getElementById('file-name').textContent = file.name;
        document.getElementById('file-size').textContent = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
        document.getElementById('file-preview').classList.remove('hidden');
        document.getElementById('dropzone').classList.add('border-mcd-yellow', 'bg-yellow-50');
      }
    }
    function clearFile() {
      document.getElementById('video-input').value = '';
      document.getElementById('file-preview').classList.add('hidden');
      document.getElementById('dropzone').classList.remove('border-mcd-yellow', 'bg-yellow-50');
    }
  </script>

</body>
</html>
